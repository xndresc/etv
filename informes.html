<title>Informes ETV — DDRISS Chiquimula</title>
<style>
  :root{
    --tinta:#1c1c1c;
    --papel:#ffffff;
    --mesa:#e8e9eb;
    --linea:#c9ccd1;
    --acento:#1565a8;
    --apagado:#5b6169;
  }
  *{box-sizing:border-box}
  :root{padding-top:env(safe-area-inset-top, 0px);
        padding-bottom:env(safe-area-inset-bottom, 0px)}
  html{scroll-padding-top:env(safe-area-inset-top, 0px)}
  html,body{margin:0;padding:0}
  body{
    background:var(--mesa);
    font-family:"Segoe UI",Roboto,-apple-system,system-ui,sans-serif;
    color:var(--tinta);
  }

  /* ---------- Barra de control (no se imprime) ---------- */
  .panel{
    position:sticky; top:0; z-index:10;
    background:var(--papel);
    border-bottom:1px solid var(--linea);
    padding:.75rem 1rem;
  }
  .panel-fila{
    max-width:60rem; margin:0 auto;
    display:flex; flex-wrap:wrap; gap:.75rem; align-items:flex-end;
  }
  .campo{display:flex; flex-direction:column; gap:.25rem}
  .campo label{font-size:.75rem; color:var(--apagado)}
  select,input[type=number]{
    font:inherit; font-size:1rem;
    padding:.5rem .6rem;
    border:1px solid var(--linea); border-radius:6px;
    background:var(--papel); color:var(--tinta);
    min-height:44px;
  }
  select:focus-visible,input:focus-visible,button:focus-visible,
  [contenteditable]:focus-visible{
    outline:2px solid var(--acento); outline-offset:2px;
  }
  .fecha-viva{
    font-size:.85rem; color:var(--apagado);
    align-self:center; padding-bottom:.6rem;
  }
  .fecha-viva b{color:var(--tinta); font-weight:600}
  .acciones{margin-left:auto; display:flex; gap:.5rem; align-items:flex-end}
  button{
    font:inherit; font-size:1rem; min-height:44px;
    padding:.5rem 1rem; border-radius:6px; cursor:pointer;
    border:1px solid var(--acento);
    background:var(--acento); color:#fff;
  }
  button.secundario{background:var(--papel); color:var(--acento)}
  .nota{
    max-width:60rem; margin:.5rem auto 0;
    font-size:.8rem; color:var(--apagado); line-height:1.5;
  }

  /* ---------- Hoja ---------- */
  .hoja{
    width:8.5in; min-height:14in;
    padding:1in;
    margin:1.25rem auto;
    background:var(--papel);
    box-shadow:0 1px 4px rgba(0,0,0,.18);
    font-family:Calibri,Carlito,"Segoe UI",Roboto,sans-serif;
    font-size:11pt; line-height:1.31;
    color:#000;
  }
  .membrete{font-weight:700}
  .fecha{text-align:right; font-weight:700; margin-top:2.6em}
  .dirigido{font-weight:700}
  .cuerpo{text-align:justify; text-indent:.5in; margin:2.6em 0 0}
  .titulo{text-align:center; font-weight:700; text-decoration:underline; margin:1.1em 0}
  ol{margin:0; padding-left:.42in}
  ol li{
    text-align:justify; font-weight:700; font-style:italic;
    margin-bottom:.55em;
  }
  .cierre{text-align:justify; text-indent:.5in; margin:1em 0 0}
  .suscribo{text-indent:.5in; margin:.9em 0 0}
  .atentamente{text-align:center; margin:.9em 0 0}
  .firmas{
    display:flex; margin-top:5.8em; page-break-inside:avoid; break-inside:avoid;
  }
  .firmas div{flex:1; text-align:center; line-height:1.35}
  .vobo{font-weight:700}

  /* campos rellenables */
  [contenteditable]{
    background:#fff6cc; border-radius:2px;
    padding:0 2px; outline:none;
  }
  [contenteditable]:empty::before{
    content:attr(data-vacio); color:#9aa0a6;
  }
  .var{background:#e1eff8; border-radius:2px; padding:0 2px}

  /* ---------- Pantalla angosta ---------- */
  @media screen and (max-width:46rem){
    .panel{position:static}
  }
  @media screen and (max-width:9in){
    .hoja{width:8.5in; padding:1in}
    .acciones{margin-left:0; width:100%}
    .acciones button{flex:1}
  }


  /* --- Zoom del documento --- */
  #lienzo{overflow-x:auto; -webkit-overflow-scrolling:touch}
  #hojas{transform-origin:top left}
  .zoom{display:flex; align-items:center; gap:.4rem; margin-left:auto}
  .zoom span{font-size:.8rem; color:var(--apagado); min-width:3.2rem; text-align:center;
             font-variant-numeric:tabular-nums}
  .zoom button{min-height:40px; min-width:44px; padding:.3rem .5rem; font-size:1.1rem;
               line-height:1; background:var(--papel); color:var(--acento)}
  @media print{
    #lienzo{overflow:visible !important; height:auto !important;
            font-size:0 !important; line-height:0 !important; display:block !important}
    #hojas{transform:none !important; width:auto !important}
  }

  /* ---------- Impresión (debe ir al final) ---------- */

<div id="lienzo"><main id="hojas"></main></div>

<script>
(function(){
  "use strict";

  var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio",
               "agosto","septiembre","octubre","noviembre","diciembre"];

  var PERSONAS = [
    {nombre:"Juan Manuel Andrés Compá Cordón", registro:"2471905192001"},
    {nombre:"Carlos Alberto Mejía Sagastume",  registro:"3382 60382 2006"},
    {nombre:"Roberto Carlos Roque Maldonado",  registro:"2472006702001"},
    {nombre:"Wilson Iván Santos Aguirre",      registro:"3415565992103"}
  ];

  var ACTIVIDADES = [
    "Llevé a cabo las medidas de control y manejo de insectos.",
    "Realicé campañas de prevención en la comunidad sobre la importancia del control de vectores.",
    "Realicé la divulgación anticipada de la visita que efectuara el auxiliar del fumigador, para que preparen la vivienda.",
    "Acordar y comprometer a las familias en la participación para la erradicación de las enfermedades transmitidas por vectores.",
    "Evitar aguas estancadas en las comunidades.",
    "Mantuve los sistemas de información entre los trabajos de campo y el servicio de salud.",
    "Organicé y orienté a las comunidades para que realicen acciones contra los diferentes vectores transmisores de enfermedades.",
    "Realicé deschatarrización: eliminación física y química de criaderos en depósitos inservibles.",
    "Realicé abatización: aplicación de larvicida en recipientes útiles y no útiles (piedras, chatarra, terrazas, entre otros).",
    "Realicé nebulización para la eliminación del zancudo adulto transmisor del dengue, intra y peridomiciliar.",
    "Realicé croquis y enumeración de viviendas."
  ];

  var MEMORIA = "informes_etv_v1";

  function ultimoDia(mesIdx, anio){
    return new Date(anio, mesIdx + 1, 0).getDate();
  }

  function editable(clase, texto, vacio){
    return '<span contenteditable="true" class="' + clase +
           '" data-vacio="' + vacio + '">' + texto + '</span>';
  }

  function hoja(p, i){
    var li = ACTIVIDADES.map(function(a){ return "<li>" + a + "</li>"; }).join("");
    li += "<li>El municipio trabajado con énfasis a lo anteriormente expuesto es " +
          editable("municipio","San José La Arada","municipio") +
          ", el período de trabajo fue realizado durante el mes de " +
          '<span class="var mes-var">agosto</span> del presente año.</li>';

    return '' +
    '<section class="hoja">' +
      '<p class="membrete">MINISTERIO DE SALUD PÚBLICA Y A.S.<br>' +
      'DIRECCIÓN DEPARTAMENTAL DE REDES INTEGRADAS DE SERVICIOS DE SALUD DE CHIQUIMULA<br>' +
      'DEPARTAMENTO DE ETV</p>' +

      '<p class="fecha">Chiquimula, <span class="var dia-var">31</span> de ' +
      '<span class="var mes-var">agosto</span> de <span class="var anio-var">2026</span>.</p>' +

      '<p class="dirigido">' +
        editable("dest-nombre","Dr. Irving Josué Lemus Cantoral","nombre") + '<br>' +
        editable("dest-cargo","Director DDRISS. Chiquimula","cargo") +
      '</p>' +

      '<p class="cuerpo">Con un atento saludo me permito presentarle el informe de trabajo ' +
      'correspondiente al mes de <span class="var mes-var">agosto</span> ' +
      '<span class="var anio-var">2026</span> sobre las distintas actividades realizadas en ' +
      'apoyo al Programa de Enfermedades Transmitidas por Vectores, en lo que al Programa de ' +
      'Dengue se refiere. No está demás indicarle que las actividades que me fueron encomendadas ' +
      'fueron estudiadas y autorizadas debidamente por el Coordinador de Vectores del Depto. de ' +
      'Chiquimula.</p>' +

      '<p class="titulo">Dichas actividades las detallo a continuación:</p>' +
      '<ol>' + li + '</ol>' +

      '<p class="cierre">Así mismo, se hace de su conocimiento que este trabajo obedece al apoyo ' +
      'del Ministerio de Salud Pública y Asistencia Social para el control de las enfermedades ' +
      'antes descritas.</p>' +

      '<p class="suscribo">Esperando el poder informarle como se merece, me suscribo. -</p>' +
      '<p class="atentamente">Atentamente.</p>' +

      '<div class="firmas">' +
        '<div>' +
          editable("firma-nombre", p.nombre, "nombre") + '<br>' +
          editable("firma-registro", p.registro, "registro") +
        '</div>' +
        '<div class="vobo">' +
          editable("coord-nombre","Vo. Bo. P.C. Henry Geovany Díaz Ciramagua","nombre") + '<br>' +
          editable("coord-cargo","Coordinador de ETV, Chiquimula.","cargo") +
        '</div>' +
      '</div>' +
    '</section>';
  }

  var elMes  = document.getElementById("mes");
  var elAnio = document.getElementById("anio");
  var elVista= document.getElementById("vista");
  var elHojas= document.getElementById("hojas");

  MESES.forEach(function(m,i){
    var o = document.createElement("option");
    o.value = i; o.textContent = m.charAt(0).toUpperCase() + m.slice(1);
    elMes.appendChild(o);
  });

  function pintar(){
    elHojas.innerHTML = PERSONAS.map(hoja).join("");
    sincronizar();
    enlazarEdiciones();
    if (typeof aplicarZoom === "function") aplicarZoom(zoomActual);
  }

  function sincronizar(){
    var i = parseInt(elMes.value,10);
    var a = parseInt(elAnio.value,10);
    if (isNaN(i)) i = new Date().getMonth();
    if (isNaN(a) || a < 1000) a = new Date().getFullYear();
    var d = ultimoDia(i,a);

    function poner(sel,val){
      var n = document.querySelectorAll(sel);
      for (var k=0;k<n.length;k++) n[k].textContent = val;
    }
    poner(".mes-var",  MESES[i]);
    poner(".anio-var", a);
    poner(".dia-var",  d);

    elVista.textContent = d + " de " + MESES[i] + " de " + a;
    guardar();
  }

  function enlazarEdiciones(){
    var campos = elHojas.querySelectorAll("[contenteditable]");
    for (var k=0;k<campos.length;k++){
      campos[k].addEventListener("blur", guardar);
      campos[k].addEventListener("keydown", function(e){
        if (e.key === "Enter"){ e.preventDefault(); this.blur(); }
      });
    }
  }

  function guardar(){
    try{
      var hojasDom = elHojas.querySelectorAll(".hoja");
      var datos = {mes:elMes.value, anio:elAnio.value, personas:[], comunes:{}};
      for (var k=0;k<hojasDom.length;k++){
        datos.personas.push({
          nombre:    hojasDom[k].querySelector(".firma-nombre").textContent,
          registro:  hojasDom[k].querySelector(".firma-registro").textContent,
          municipio: hojasDom[k].querySelector(".municipio").textContent
        });
      }
      if (hojasDom.length){
        datos.comunes = {
          destNombre:  hojasDom[0].querySelector(".dest-nombre").textContent,
          destCargo:   hojasDom[0].querySelector(".dest-cargo").textContent,
          coordNombre: hojasDom[0].querySelector(".coord-nombre").textContent,
          coordCargo:  hojasDom[0].querySelector(".coord-cargo").textContent
        };
      }
      localStorage.setItem(MEMORIA, JSON.stringify(datos));
    }catch(e){ /* sin almacenamiento disponible: se sigue igual */ }
  }

  function restaurar(){
    try{
      var crudo = localStorage.getItem(MEMORIA);
      if (!crudo) return false;
      var d = JSON.parse(crudo);
      if (d.personas && d.personas.length){
        PERSONAS = d.personas.map(function(p){
          return {nombre:p.nombre, registro:p.registro, municipio:p.municipio};
        });
      }
      if (d.mes  !== undefined) elMes.value  = d.mes;
      if (d.anio !== undefined) elAnio.value = d.anio;
      window.__comunes = d.comunes || null;
      window.__municipios = (d.personas||[]).map(function(p){return p.municipio;});
      return true;
    }catch(e){ return false; }
  }

  function aplicarGuardados(){
    var c = window.__comunes;
    var muni = window.__municipios || [];
    var hojasDom = elHojas.querySelectorAll(".hoja");
    for (var k=0;k<hojasDom.length;k++){
      if (c){
        hojasDom[k].querySelector(".dest-nombre").textContent  = c.destNombre;
        hojasDom[k].querySelector(".dest-cargo").textContent   = c.destCargo;
        hojasDom[k].querySelector(".coord-nombre").textContent = c.coordNombre;
        hojasDom[k].querySelector(".coord-cargo").textContent  = c.coordCargo;
      }
      if (muni[k]) hojasDom[k].querySelector(".municipio").textContent = muni[k];
    }
  }

  document.getElementById("agregar").addEventListener("click", function(){
    PERSONAS.push({nombre:"", registro:""});
    var c = window.__comunes;
    pintar();
    if (c) aplicarGuardados();
    var ultimas = elHojas.querySelectorAll(".hoja");
    var u = ultimas[ultimas.length-1];
    u.scrollIntoView({behavior:"smooth", block:"start"});
    u.querySelector(".firma-nombre").focus();
  });

/* === PDF en oficio vertical (8.5 x 14 in), independiente del diálogo de iOS === */
function descargarPDF(){
  var jsPDFctor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if (!jsPDFctor){ alert("No se pudo preparar el PDF. Recargá la página e intentá de nuevo."); return; }

  var PT = 72;
  var AN = 8.5 * PT, AL = 14 * PT;      // 612 x 1008
  var M  = 1 * PT;                       // margen 72
  var UTIL = AN - 2*M;                   // 468
  var FS = 11, LH = 14.5, SANGRIA = 36;

  var doc = new jsPDFctor({unit:"pt", format:[AN, AL], orientation:"portrait"});

  try{
    doc.addFileToVFS("Carlito.ttf", FONT_REG);
    doc.addFont("Carlito.ttf", "Carlito", "normal");
    doc.addFileToVFS("Carlito-Bold.ttf", FONT_BOLD);
    doc.addFont("Carlito-Bold.ttf", "Carlito", "bold");
    doc.addFileToVFS("Carlito-BoldItalic.ttf", FONT_BOLDIT);
    doc.addFont("Carlito-BoldItalic.ttf", "Carlito", "bolditalic");
  }catch(e){}

  function fuente(estilo, tam){
    try{ doc.setFont("Carlito", estilo); }
    catch(e){ doc.setFont("helvetica", estilo === "bolditalic" ? "bolditalic" : estilo); }
    doc.setFontSize(tam === undefined ? FS : tam);
  }

  // Reparte el sobrante entre los espacios para que la línea llegue al margen
  function lineaJustificada(linea, x, y, ancho){
    var palabras = linea.split(" ").filter(function(w){ return w.length; });
    if (palabras.length < 2){ doc.text(linea, x, y); return; }
    var suma = 0;
    for (var i=0; i<palabras.length; i++) suma += doc.getTextWidth(palabras[i]);
    var hueco = (ancho - suma) / (palabras.length - 1);
    var esp = doc.getTextWidth(" ");
    if (hueco < esp) hueco = esp;            // nunca apretar de más
    if (hueco > esp * 4){ doc.text(linea, x, y); return; }   // ni estirar de más
    var cx = x;
    for (var j=0; j<palabras.length; j++){
      doc.text(palabras[j], cx, y);
      cx += doc.getTextWidth(palabras[j]) + hueco;
    }
  }

  // Párrafo justificado; devuelve la y siguiente
  function parrafo(txt, x, y, ancho, estilo, sangria){
    fuente(estilo);
    var sg = sangria || 0;
    var lineas = doc.splitTextToSize(txt, ancho - sg);
    for (var i=0; i<lineas.length; i++){
      var xx = x + (i === 0 ? sg : 0);
      var w  = ancho - (i === 0 ? sg : 0);
      if (i < lineas.length - 1) lineaJustificada(lineas[i], xx, y, w);
      else doc.text(lineas[i], xx, y);
      y += LH;
    }
    return y;
  }

  var i = parseInt(elMes.value,10), a = parseInt(elAnio.value,10);
  if (isNaN(i)) i = new Date().getMonth();
  if (isNaN(a)) a = new Date().getFullYear();
  var d = ultimoDia(i,a);
  var mesTxt = MESES[i];

  var hojas = elHojas.querySelectorAll(".hoja");

  for (var h=0; h<hojas.length; h++){
    if (h > 0) doc.addPage([AN, AL], "portrait");
    var hoja = hojas[h];
    function leer(sel){
      var n = hoja.querySelector(sel);
      return n ? n.textContent.trim() : "";
    }

    doc.setTextColor(0,0,0);
    var y = M + FS;

    // Membrete
    fuente("bold");
    doc.text("MINISTERIO DE SALUD PÚBLICA Y A.S.", M, y); y += LH;
    doc.text("DIRECCIÓN DEPARTAMENTAL DE REDES INTEGRADAS DE SERVICIOS DE SALUD DE CHIQUIMULA", M, y); y += LH;
    doc.text("DEPARTAMENTO DE ETV", M, y); y += LH * 3;

    // Fecha
    fuente("bold");
    doc.text("Chiquimula, " + d + " de " + mesTxt + " de " + a + ".", M + UTIL, y, {align:"right"});
    y += LH;

    // Destinatario
    fuente("bold");
    doc.text(leer(".dest-nombre"), M, y); y += LH;
    doc.text(leer(".dest-cargo"), M, y); y += LH * 3;

    // Párrafo de apertura
    y = parrafo(
      "Con un atento saludo me permito presentarle el informe de trabajo correspondiente al mes de "
      + mesTxt + " " + a + " sobre las distintas actividades realizadas en apoyo al Programa de "
      + "Enfermedades Transmitidas por Vectores, en lo que al Programa de Dengue se refiere. "
      + "No está demás indicarle que las actividades que me fueron encomendadas fueron estudiadas "
      + "y autorizadas debidamente por el Coordinador de Vectores del Depto. de Chiquimula.",
      M, y, UTIL, "normal", SANGRIA) + 8;

    // Título subrayado
    fuente("bold");
    var tt = "Dichas actividades las detallo a continuación:";
    var tw = doc.getTextWidth(tt);
    var tx = M + (UTIL - tw)/2;
    doc.text(tt, tx, y);
    doc.setLineWidth(0.7);
    doc.line(tx, y + 2, tx + tw, y + 2);
    y += LH + 8;

    // Lista numerada
    var NUMX = M + 28, TXTX = M + 46, LW = UTIL - 46;
    for (var k=0; k<ACTIVIDADES.length; k++){
      fuente("bolditalic");
      doc.text((k+1) + ".", NUMX, y);
      y = parrafo(ACTIVIDADES[k], TXTX, y, LW, "bolditalic") + 5;
    }
    fuente("bolditalic");
    doc.text((ACTIVIDADES.length+1) + ".", NUMX, y);
    y = parrafo("El municipio trabajado con énfasis a lo anteriormente expuesto es "
      + leer(".municipio") + ", el período de trabajo fue realizado durante el mes de "
      + mesTxt + " del presente año.", TXTX, y, LW, "bolditalic") + 8;

    // Cierre
    y = parrafo("Así mismo, se hace de su conocimiento que este trabajo obedece al apoyo del "
      + "Ministerio de Salud Pública y Asistencia Social para el control de las enfermedades "
      + "antes descritas.", M, y, UTIL, "normal", SANGRIA) + 8;

    fuente("normal");
    doc.text("Esperando el poder informarle como se merece, me suscribo. -", M + SANGRIA, y);
    y += LH + 8;
    var at = "Atentamente.";
    doc.text(at, M + (UTIL - doc.getTextWidth(at))/2, y);

    // Firmas al pie
    var yf = AL - 128;
    var izq = M + UTIL * 0.23, der = M + UTIL * 0.74;
    fuente("normal");
    doc.text(leer(".firma-nombre"), izq, yf, {align:"center"});
    doc.text(leer(".firma-registro"), izq, yf + LH, {align:"center"});
    fuente("bold");
    doc.text(leer(".coord-nombre"), der, yf, {align:"center"});
    doc.text(leer(".coord-cargo"), der, yf + LH, {align:"center"});
  }

  doc.save("Informes " + capitalMes(mesTxt) + " " + a + ".pdf");
}

function capitalMes(t){ return t.charAt(0).toUpperCase() + t.slice(1); }

  document.getElementById("descargar").addEventListener("click", descargarPDF);
  document.getElementById("imprimir").addEventListener("click", function(){ window.print(); });

  elMes.addEventListener("change", sincronizar);
  elAnio.addEventListener("input", sincronizar);

  // Arranque
  var habia = restaurar();
  if (!habia){
    var hoy = new Date();
    elMes.value  = hoy.getMonth();
    elAnio.value = hoy.getFullYear();
  }

  /* --- Zoom --- */
  var ANCHO_HOJA_PX = 8.5 * 96;
  var zoomActual = 1, zoomListo = false;
  var elLienzo = document.getElementById("lienzo");

  function aplicarZoom(k){
    zoomActual = Math.min(2, Math.max(0.25, k));
    elHojas.style.width = ANCHO_HOJA_PX + "px";
    elHojas.style.transform = "scale(" + zoomActual + ")";
    elLienzo.style.height = (elHojas.scrollHeight * zoomActual) + "px";
    var et = document.getElementById("zoomVal");
    if (et) et.textContent = Math.round(zoomActual * 100) + "%";
    if (zoomListo){ try{ localStorage.setItem("zoom_inf", String(zoomActual)); }catch(e){} }
  }
  function zoomQueQuepa(){
    var disp = (elLienzo ? elLienzo.clientWidth : window.innerWidth) - 8;
    return Math.min(1, disp / ANCHO_HOJA_PX);
  }
  function iniciarZoom(){
    var k = null;
    try{ var g = localStorage.getItem("zoom_inf"); if (g) k = parseFloat(g); }catch(e){}
    aplicarZoom(k && !isNaN(k) ? k : zoomQueQuepa());
    zoomListo = true;
  }
  var bMas=document.getElementById("zoomMas"), bMen=document.getElementById("zoomMenos"),
      bAju=document.getElementById("zoomAjustar");
  if (bMas) bMas.addEventListener("click", function(){ aplicarZoom(zoomActual+0.1); });
  if (bMen) bMen.addEventListener("click", function(){ aplicarZoom(zoomActual-0.1); });
  if (bAju) bAju.addEventListener("click", function(){ aplicarZoom(zoomQueQuepa()); });
  window.addEventListener("resize", function(){ aplicarZoom(zoomActual); });

  window.addEventListener("beforeprint", function(){
    elHojas.style.transform = "none";
    elHojas.style.width = "auto";
    elLienzo.style.height = "auto";
  });
  window.addEventListener("afterprint", function(){ aplicarZoom(zoomActual); });

  pintar();
  if (habia) aplicarGuardados();
  iniciarZoom();
})();
</script>
</body>
</html>
